name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  psk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test

  lithos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lithos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --check api/buffer-sync.js
      - run: npm run build

  router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p "test_*.py" -v

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04080F">
<title>اتصال برقرار نیست · POORS</title>
<style>
:root{--bg:#04080F;--bg2:#07111F;--blue:#287BFF;--cyan:#00E5FF;--white:#F0EDE8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 35%,#0B1E38 0,var(--bg2) 45%,var(--bg) 100%);color:var(--white);
font-family:-apple-system,BlinkMacSystemFont,"Vazirmatn",Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;
padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));text-align:center}
main{max-width:420px}
.mark{width:96px;height:96px;margin:0 auto 28px;border-radius:50%;border:4px solid var(--cyan);box-shadow:0 0 40px rgba(40,123,255,.45);
display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--cyan)}
h1{font-size:1.6rem;margin:0 0 12px;font-weight:700}
p{margin:0 0 28px;line-height:1.9;color:rgba(240,237,232,.72)}
button{font:inherit;background:var(--blue);color:var(--white);border:0;border-radius:999px;padding:12px 28px;cursor:pointer}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
small{display:block;margin-top:32px;letter-spacing:.2em;font-size:.7rem;color:rgba(240,237,232,.45);direction:ltr}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">◈</div>
<h1>اتصال برقرار نیست</h1>
<p>به نظر می‌رسد اینترنت در دسترس نیست. پس از برقراری اتصال، دوباره تلاش کنید.</p>
<button type="button" onclick="location.reload()">تلاش دوباره</button>
<small>POORS · ALGORITHME 3000</small>
</main>
</body>
</html>
